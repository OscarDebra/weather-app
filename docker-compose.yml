services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    expose:
      - "8000"
  
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    expose:
    - "80"

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - frontend
      - backend